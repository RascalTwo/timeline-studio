<!doctype html>
<!-- Shown by the homelab front door (RascalTwo/homelab: lightsail/fallback-refresh)
     while Timeline Studio is down. It's copied once a day while the app is up, so it
     must be fully self-contained: no fonts, images or scripts from anywhere else.
     Colours are web/styles.css's tokens, repeated because that file can't be loaded. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timeline Studio · Be right back</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 2rem; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
  main { width: 100%; max-width: 30rem; }
  .brand { font-size: 1.15rem; font-weight: 700; margin: 0 0 .9rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem 1.6rem; }
  h1 { display: flex; align-items: center; gap: .65rem; font-size: 1.35rem; margin: 0 0 .75rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  p { margin: 0 0 .75rem; color: var(--muted); }
  p:last-child { margin: 0; }
  small { display: block; margin-top: .9rem; color: var(--muted); font-size: .8rem; text-align: right; }
</style>
</head>
<body>
<main>
  <p class="brand">Timeline Studio</p>
  <div class="card">
    <h1><span class="dot" aria-hidden="true"></span>Be right back</h1>
    <p>This site is temporarily offline. Nothing you did caused this, and it's usually back within a few minutes.</p>
    <p>This page checks again on its own every 30&nbsp;seconds.</p>
  </div>
  <small id="status">Next check in 30 s</small>
</main>
<script>
  let left = 30;
  const status = document.getElementById('status');
  setInterval(() => {
    left -= 1;
    if (left <= 0) location.reload();
    else status.textContent = 'Next check in ' + left + ' s';
  }, 1000);
</script>
</body>
</html>
